<!doctype html>
<html lang="tk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kömekçi</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F6F8FD;
    color: #111;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 24px 20px 32px;
    box-sizing: border-box;
  }
  .img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 16px;
    background: #E4E9F7;
  }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p.desc { font-size: 14px; line-height: 1.6; color: #444; white-space: pre-wrap; }
  .price { font-size: 16px; font-weight: 700; margin: 12px 0; }
  .btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 12px;
  }
  .btn-primary { background: #264FED; color: #fff; }
  .btn-secondary { background: #fff; color: #264FED; border: 1px solid #C6D2FF; }
  .muted { color: #888; font-size: 13px; margin-top: 24px; text-align: center; }
  .skeleton { opacity: .5; }
</style>
</head>
<body>
  <div class="card">
    <img class="img skeleton" id="img" alt="" />
    <h1 id="name">Ýüklenýär…</h1>
    <p class="desc" id="desc"></p>
    <div class="price" id="price"></div>

    <a class="btn btn-primary" id="openApp">Kömekçi app-da açmak</a>
    <a class="btn btn-secondary" href="#" id="playStore">Google Play-dan ýükle</a>
    <a class="btn btn-secondary" href="#" id="appStore">App Store-dan ýükle</a>

    <div class="muted">Eger telefonyňyzda Kömekçi programmasy gurlan bolsa, awtomatik açylar.</div>
  </div>

<script>
  // ── Config ────────────────────────────────────────────────────────────
  // TODO: once the API/site move to a real HTTPS domain, update this and
  // switch Android/iOS to verified App Links / Universal Links so the OS
  // opens the app automatically without this landing page at all.
  var API_BASE = "http://216.250.12.53:8124/api/client/user";
  var APP_SCHEME = "komekchi";
  // TODO: fill in once the app is published.
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.example.komekchi_service";
  var APP_STORE_URL = "https://apps.apple.com/app/idXXXXXXXXXX";

  var params = new URLSearchParams(window.location.search);
  var uuid = params.get("uuid");

  document.getElementById("playStore").href = PLAY_STORE_URL;
  document.getElementById("appStore").href = APP_STORE_URL;

  if (uuid) {
    var appLink = APP_SCHEME + "://detail?uuid=" + encodeURIComponent(uuid);
    document.getElementById("openApp").href = appLink;

    // Best-effort auto-open; browsers vary in whether they allow this
    // without a user gesture, so the visible button above is the reliable
    // fallback.
    window.location.href = appLink;

    fetch(API_BASE + "/subcategory/" + encodeURIComponent(uuid))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var item = res && res.data;
        if (!item) throw new Error("not found");

        document.getElementById("name").textContent = item.name_tm || "Kömekçi";
        document.getElementById("desc").textContent = item.desc_tm || "";

        if (item.img) {
          var img = item.img.indexOf("http") === 0
            ? item.img
            : "http://216.250.12.53:8124" + item.img;
          document.getElementById("img").src = img;
          document.getElementById("img").classList.remove("skeleton");
        }

        var price = item.payment_method && item.payment_method.price;
        if (price) {
          document.getElementById("price").textContent = price + " TMT";
        }
      })
      .catch(function () {
        document.getElementById("name").textContent = "Kömekçi";
        document.getElementById("desc").textContent =
          "Bu hyzmaty görmek üçin Kömekçi programmasyny açyň.";
      });
  } else {
    document.getElementById("name").textContent = "Kömekçi";
    document.getElementById("openApp").href = APP_SCHEME + "://";
  }
</script>
</body>
</html>
